:root{

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

.home{font-size:.85rem;color:var(--muted);text-decoration:none;width:100%}

h1{font-family:var(--display);font-weight:400;font-size:2rem;margin:0;letter-spacing:-.01em;text-wrap:balance}

.chip:focus-visible,.ans:focus-visible,.btn:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
/* timeline progress */
.rail{position:relative;display:grid;grid-template-columns:repeat(var(--n,10),1fr);align-items:center;padding-block:6px}
.rail::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--line)}
.tick{position:relative;justify-self:center;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--line)}
.tick.now{border-color:var(--brass);background:var(--brass);transform:scale(1.25)}
.tick.ok{background:var(--good);border-color:var(--good)}
.tick.no{background:var(--bad);border-color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:24px 20px;display:flex;flex-direction:column;gap:14px}
.kicker{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--brass);font-weight:700;margin:0}
.q{font-family:var(--display);font-size:1.45rem;line-height:1.3;margin:0;text-wrap:balance}
.q.year{font-family:var(--mono);font-weight:600;font-size:3.2rem;letter-spacing:-.02em;line-height:1}
.era{font-size:.85rem;color:var(--muted);margin:0}
.answers{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.answers.events{grid-template-columns:1fr}
.ans{font:inherit;text-align:left;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:6px;padding:14px 16px;cursor:pointer;transition:border-color .15s,background .15s;min-width:0}
.answers:not(.events) .ans{font-family:var(--mono);font-size:1.3rem;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.ans:hover:not(:disabled){border-color:var(--accent)}
.ans:disabled{cursor:default}
.ans.right{background:var(--good-bg);border-color:var(--good);color:var(--ink)}
.ans.wrong{background:var(--bad-bg);border-color:var(--bad)}
.ans.dim{opacity:.55}
.feedback{border-left:3px solid var(--good);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:4px}
.feedback.miss{border-color:var(--bad)}
.feedback strong{font-size:1.05rem}
.feedback p{margin:0;color:var(--muted);max-width:62ch}
.btn{font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:12px 20px;cursor:pointer;align-self:flex-start}
.final{font-family:var(--mono);font-size:3.4rem;font-weight:600;margin:0;line-height:1}
.final small{font-size:1.2rem;color:var(--muted)}
.review{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.review li{display:grid;grid-template-columns:5.5rem 1fr;gap:12px;border-top:1px solid var(--line);padding-top:8px;font-size:.95rem}
.review .y{font-family:var(--mono);font-weight:600;color:var(--brass)}
.review .m{color:var(--bad);font-size:.85rem}
@media (max-width:420px){.q.year{font-size:2.6rem}.answers:not(.events) .ans{font-size:1.1rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const TOPIC = {all:"All topics", w:"Wars", p:"Politics", s:"Science & invention", x:"Exploration", c:"Culture & religion", d:"Disasters", a:"Australia"};

const ERA = {
  all: ()=>true,
  ancient: y=>y<1000,
  early: y=>y>=1000&&y<1800,
  c19: y=>y>=1800&&y<1900,
  modern: y=>y>=1900
};
const ROUND = 10;
const fmt = y => y<0 ? `${-y} BC` : (y<1000 ? `AD ${y}` : `${y}`);
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

let S = {mode:"mix", era:"all", topic:"all", len:10, qs:[], i:0, score:0, streak:0, results:[], answered:false};
const $ = id => document.getElementById(id);
const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };

function bestKey(){return `yby-best-${S.mode}-${S.era}-${S.topic}`}
function showBest(){const b=store.get(bestKey()); $("best").textContent = b===null ? "–" : (b.includes("/")?b:`${b}/10`);}

function yearOptions(y){
  const spread = y<0?120 : y<1000?60 : y<1800?30 : y<1900?12 : 8;
  const set = new Set([y]);
  let guard=0;
  while(set.size<4 && guard++<200){
    let d = Math.ceil(Math.random()*spread) * (Math.random()<.5?-1:1);
    const c = y+d;
    if(c===0 || c>2026) continue;
    if((y<0)!==(c<0) && Math.abs(y)<spread) { /* allow crossing BC/AD only rarely */ if(Math.random()<.7) continue; }
    set.add(c);
  }
  return shuffle([...set]);
}
function eventOptions(ev, pool){
  const others = shuffle(EVENTS.filter(x=>x.y!==ev.y));
  // prefer distractors from the same period so the choice isn't obvious
  const near = others.filter(x=>Math.abs(x.y-ev.y) < (ev.y<1000?800:ev.y<1800?300:80));
  const picks = [];
  for(const x of [...near, ...others]){ if(!picks.includes(x) && !picks.some(p=>p.y===x.y)) picks.push(x); if(picks.length===3) break; }
  return shuffle([ev, ...picks]);
}

function filtered(){return EVENTS.filter(e=>ERA[S.era](e.y) && (S.topic==="all" || e.t===S.topic));}
function newRound(){
  const all = filtered();
  $("count").textContent = `${all.length} event${all.length===1?"":"s"} in this selection · ${EVENTS.length} in total`;
  S.i=0; S.score=0; S.streak=0; S.results=[]; S.answered=false;
  $("score").textContent=0; $("streak").textContent=0; showBest();
  if(all.length<4){
    S.qs=[]; S.len=0; $("rail").innerHTML="";
    $("card").innerHTML=`<p class="kicker">Not enough events</p><p class="era">Only ${all.length} event${all.length===1?"":"s"} match this period and topic. Pick a wider period or another topic.</p>`;
    return;
  }
  const pool = shuffle(all.slice()).slice(0,ROUND);
  S.len = pool.length;
  S.qs = pool.map(ev=>{
    const type = S.mode==="mix" ? (Math.random()<.5?"when":"what") : S.mode;
    return type==="when" ? {type, ev, opts:yearOptions(ev.y)} : {type, ev, opts:eventOptions(ev)};
  });
  drawRail(); drawQuestion();
}

function drawRail(){
  const r=$("rail"); r.innerHTML=""; r.style.setProperty("--n",S.len);
  for(let k=0;k<S.len;k++){
    const t=document.createElement("span"); t.className="tick";
    if(k<S.results.length) t.classList.add(S.results[k].ok?"ok":"no");
    else if(k===S.i) t.classList.add("now");
    r.appendChild(t);
  }
}

function drawQuestion(){
  const q=S.qs[S.i], c=$("card");
  c.innerHTML="";
  const k=document.createElement("p"); k.className="kicker";
  k.textContent=`Question ${S.i+1} of ${S.len} · ${q.type==="when"?"When did this happen?":"What happened this year?"}`;
  const h=document.createElement("h2");
  if(q.type==="when"){ h.className="q"; h.textContent=q.ev.e; }
  else { h.className="q year"; h.textContent=fmt(q.ev.y); }
  const grid=document.createElement("div"); grid.className="answers"+(q.type==="what"?" events":"");
  q.opts.forEach((o,idx)=>{
    const b=document.createElement("button"); b.className="ans"; b.id=`ans-${idx}`;
    b.textContent = q.type==="when" ? fmt(o) : o.e;
    b.addEventListener("click",()=>answer(o,b,grid));
    grid.appendChild(b);
  });
  const fb=document.createElement("div"); fb.id="fb";
  c.append(k,h,grid,fb);
}

function answer(o,btn,grid){
  if(S.answered) return; S.answered=true;
  const q=S.qs[S.i];
  const ok = q.type==="when" ? o===q.ev.y : o===q.ev;
  [...grid.children].forEach((b,idx)=>{
    b.disabled=true;
    const v=q.opts[idx];
    const isRight = q.type==="when" ? v===q.ev.y : v===q.ev;
    if(isRight) b.classList.add("right");
    else if(b===btn) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  if(ok){S.score++;S.streak++;} else S.streak=0;
  S.results.push({ok, q, picked:o});
  $("score").textContent=S.score; $("streak").textContent=S.streak;

  const fb=$("fb"); fb.className="feedback"+(ok?"":" miss");
  const s=document.createElement("strong");
  if(ok) s.textContent = S.streak>=3 ? `Correct, ${S.streak} in a row` : "Correct";
  else if(q.type==="when") s.textContent = `It was ${fmt(q.ev.y)}, ${Math.abs(o-q.ev.y)} years ${o<q.ev.y?"later":"earlier"} than your guess`;
  else s.textContent = `In ${fmt(q.ev.y)}: ${q.ev.e}`;
  const p=document.createElement("p");
  p.textContent = (q.type==="what" && ok) ? q.ev.n : (q.type==="when" ? q.ev.n : `${q.ev.n} (Your pick happened in ${fmt(o.y)}.)`);
  const nx=document.createElement("button"); nx.className="btn"; nx.id="next";
  nx.textContent = S.i+1<S.len ? "Next question" : "See results";
  nx.addEventListener("click",next);
  fb.append(s,p);
  $("card").appendChild(nx);
  nx.focus({preventScroll:true});
  drawRail();
}

function next(){
  S.i++; S.answered=false;
  if(S.i<S.len){ drawRail(); drawQuestion(); } else finish();
}

function finish(){
  drawRail();
  const raw = store.get(bestKey());
  const prev = raw===null ? -1 : Number(String(raw).split("/")[0]);
  const isBest = S.score>prev;
  if(isBest) store.set(bestKey(), `${S.score}/${S.len}`);
  showBest();
  const c=$("card"); c.innerHTML="";
  const pct=S.score/S.len;
  const verdict = pct===1?"Perfect round.":pct>=.8?"Excellent knowledge of the timeline.":pct>=.5?"A solid round.":"History is long. Try another round.";
  c.innerHTML = `<p class="kicker">Round complete${isBest&&prev>=0?" · New best":""}</p>
    <p class="final">${S.score}<small> / ${S.len}</small></p>
    <p class="era">${verdict}</p>`;
  const misses=S.results.filter(r=>!r.ok);
  if(misses.length){
    const h=document.createElement("p"); h.className="kicker"; h.textContent="Worth remembering";
    const ul=document.createElement("ul"); ul.className="review";
    misses.forEach(r=>{
      const li=document.createElement("li");
      const yourPick = r.q.type==="when" ? `You said ${fmt(r.picked)}` : `You picked: ${r.picked.e} (${fmt(r.picked.y)})`;
      li.innerHTML=`<span class="y">${fmt(r.q.ev.y)}</span><span><span class="t"></span><br><span class="m"></span></span>`;
      li.querySelector(".t").textContent=r.q.ev.e; li.querySelector(".m").textContent=yourPick;
      ul.appendChild(li);
    });
    c.append(h,ul);
  }
  const again=document.createElement("button"); again.className="btn"; again.id="again"; again.textContent="Play again";
  again.addEventListener("click",newRound); c.appendChild(again);
}

function setPressed(attr,val){document.querySelectorAll(`[data-${attr}]`).forEach(b=>b.setAttribute("aria-pressed", String(b.dataset[attr]===val)));}
document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>{S.mode=b.dataset.mode;setPressed("mode",S.mode);store.set("yby-mode",S.mode);newRound();}));
document.querySelectorAll("[data-era]").forEach(b=>b.addEventListener("click",()=>{S.era=b.dataset.era;setPressed("era",S.era);store.set("yby-era",S.era);newRound();}));

document.querySelectorAll("[data-topic]").forEach(b=>b.addEventListener("click",()=>{S.topic=b.dataset.topic;setPressed("topic",S.topic);store.set("yby-topic",S.topic);newRound();}));
S.mode = store.get("yby-mode") || "mix";
S.topic = store.get("yby-topic") || "all";
if(!TOPIC[S.topic]) S.topic="all";
S.era = store.get("yby-era") || "all";
if(!ERA[S.era]) S.era="all";
setPressed("mode",S.mode); setPressed("era",S.era); setPressed("topic",S.topic);
newRound();
</script>
</body>
</html>
